<VirtualHost *:80>
    ServerName parcial.empresa.local
    DocumentRoot /var/www/parcial.empresa.local
    DirectoryIndex index.html

    <Directory /var/www/parcial.empresa.local>
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/parcial_error.log
    CustomLog ${APACHE_LOG_DIR}/parcial_access.log combined
</VirtualHost>
