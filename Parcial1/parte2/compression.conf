<IfModule mod_filter.c>
    FilterDeclare   COMPRESS
    FilterProvider  COMPRESS BROTLI_COMPRESS "%{req:Accept-Encoding} =~ /\bbr\b/ && %{CONTENT_TYPE} =~ m#^(text/html|text/plain|text/xml|application/xml|text/css|text/javascript|application/javascript|application/json|image/svg\+xml)#"
    FilterProvider  COMPRESS DEFLATE         "%{req:Accept-Encoding} =~ /\bgzip\b/ && %{req:Accept-Encoding} !~ /\bbr\b/ && %{CONTENT_TYPE} =~ m#^(text/html|text/plain|text/xml|application/xml|text/css|text/javascript|application/javascript|application/json|image/svg\+xml)#"
    FilterChain     COMPRESS
</IfModule>
